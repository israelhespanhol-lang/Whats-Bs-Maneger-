services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: whats_manager
      POSTGRES_PASSWORD: whats_manager
      POSTGRES_DB: whats_manager
    ports:
      - "5432:5432"
    volumes:
      - whats_manager_postgres:/var/lib/postgresql/data

volumes:
  whats_manager_postgres:
